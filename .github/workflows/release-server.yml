name: Release Server

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z. B. v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Als Pre-Release veröffentlichen"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: windows-x86_64
            os: windows-latest
            binary_path: server/target/release/nochat-server.exe
            asset_name: nochat-server-windows-x86_64.exe
          - target_name: linux-x86_64
            os: ubuntu-latest
            binary_path: server/target/release/nochat-server
            asset_name: nochat-server-linux-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Build server (release)
        run: cargo build --release --locked --manifest-path server/Cargo.toml

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary_path }}" "dist/${{ matrix.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: NoChat Server ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist/*

